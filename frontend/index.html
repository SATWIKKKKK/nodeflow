<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noesis — watch your own code run</title>
    <meta
      name="description"
      content="Noesis runs your Python in a sandbox, traces every object at every line, and replays arrays and linked lists step by step."
    />
    <meta name="theme-color" content="#fbf9f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (() => {
        const key = "theme_preference";
        let saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch {}
        const theme = ["dark", "light", "system"].includes(saved) ? saved : "light";
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const dark = theme === "dark" || (theme === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
